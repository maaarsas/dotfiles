# Generic project template: one window per project, fixed pane layout inside.
#
# First project (creates the session):
#   smug start project root=~/vinted-pay/svc-notifier name=svc-notifier
#
# Additional projects (adds a window to the session you're already in):
#   smug start project -i root=~/vinted-pay/svc-api name=svc-api
#
# Layout is main-horizontal:
#
#   +-----------------------------+
#   |            nvim             |
#   +--------------+--------------+
#   |   terminal   |   terminal   |
#   +--------------+--------------+

session: dev
root: ${root}

windows:
  - name: ${name}
    layout: main-horizontal
    commands:
      - nvim .
    panes:
      - type: horizontal
        root: .
      - type: horizontal
        root: .
