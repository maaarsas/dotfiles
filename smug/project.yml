# Generic project template: one window per project, fixed pane layout inside.
#
# First project (creates the session):
#   smug start project root=~/vinted-pay/svc-notifier name=svc-notifier
#
# Additional projects (adds a window to the session you're already in):
#   smug start project -i root=~/vinted-pay/svc-api name=svc-api
#
# Layout is main-horizontal:
#
#   +-----------------------------+
#   |            nvim             |
#   +--------------+--------------+
#   |   terminal   |    claude    |
#   +--------------+--------------+

session: dev
root: ${root}

windows:
  - name: ${name}
    layout: main-horizontal
    commands:
      - nvim .
    # NOTE: declared in reverse. smug splits the same original pane for each
    # entry, so each new pane takes index 1 and pushes the previous one right.
    # main-horizontal orders panes by index, so the last entry ends up leftmost.
    panes:
      - type: horizontal
        root: .
      - type: horizontal
        root: .
        commands:
          # nested tmux, so this pane gets its own tabs. TMUX= clears the
          # outer marker so tmux allows the nesting; -A attaches if the
          # session already exists instead of erroring. -L puts it on its own
          # socket -- a second client on the default socket would be the same
          # server, sharing its global status bar with the outer session.
          - TMUX= tmux -L nested new-session -A -s term-${name} -c "${root}"
