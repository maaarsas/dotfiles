# -- Basic Settings ------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix # C-a C-a reaches a nested session
set -g escape-time 0
set -g history-limit 1000
set -g base-index 1
set -g pane-base-index 1
set -g mouse on

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g status-left-length 50
set -g status-right-length 50
# status-left / status-right themselves are owned by dracula (see below) --
# setting them here would just be overwritten when tpm loads the theme.

# -- Vim Key Bindings ---------------------------------------
setw -g mode-keys vi   # vi keys in copy mode
set -g status-keys vi  # vi keys at the command prompt

# Copy mode: v to select, y to copy, Escape to cancel
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send -X cancel

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable: hold the key after the prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -- Plugins -----------------------------------------------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin 'dracula/tmux'

# Theme configuration
# A nested server (started from inside another tmux) inherits the outer socket
# as TMUX in its global environment; a top-level server has the variable present
# but *empty*, so `show-environment -g TMUX` exits 0 either way -- the value is
# what distinguishes them, not the exit status. $TMUX itself is no good here:
# tmux always sets it to the current server's socket inside if-shell. Nesting has
# to be a separate server (tmux -L ...) for this to work; a second client on the
# same socket shares these global options.
if-shell '[ -n "$(tmux show-environment -g TMUX 2>/dev/null | sed -n "s/^TMUX=//p")" ]' \
  'set -g @dracula-plugins " "' \
  'set -g @dracula-plugins "cpu-usage ram-usage network-bandwidth weather"'
# Session name in place of dracula's default smiley on the far left.
set -g @dracula-show-left-icon "#S"
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location false
set -g @dracula-show-powerline true

# Per-widget colors; cpu-usage and weather both default to orange
set -g @dracula-cpu-usage-colors "orange dark_gray"
set -g @dracula-ram-usage-colors "cyan dark_gray"
set -g @dracula-weather-colors "light_purple dark_gray"
set -g @dracula-network-bandwidth-colors "green dark_gray"
set -g @dracula-network-bandwidth-interval 4 # refresh period is 1s + this

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# C-h/j/k/l crosses nvim splits and tmux panes alike
set -g @plugin 'christoomey/vim-tmux-navigator'
bind C-l send-keys C-l # prefix C-l still clears the screen

# Initialize TMUX plugin manager
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
